<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/base :: head('Mi Perfil')}"></head>
<body>

<header th:replace="~{layouts/base :: cabecera}"></header>

<main>
    <div class="form-container">
        <h2>Tu Perfil</h2>

        <div class="perfil-info" th:if="${usuario}">
            <p>
                <strong>Nombre Completo:</strong>
                <span th:text="${usuario.nombre}"></span>
            </p>
            <p>
                <strong>Nombre de Usuario:</strong>
                <span th:text="${usuario.username}"></span>
            </p>
            <p>
                <strong>Correo Electrónico:</strong>
                <span th:text="${usuario.email}"></span>
            </p>
            <p>
                <strong>Teléfono:</strong>
                <span th:text="${usuario.telefono != null ? usuario.telefono : 'No especificado'}"></span>
            </p>
            <p>
                <strong>Fecha de Registro:</strong>
                <span th:text="${#temporals.format(usuario.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></span>
            </p>

            <div style="margin-top: 25px;">
                <strong style="color: #d4af37; display: block; margin-bottom: 10px;">Roles de Acceso:</strong>
                <div>
                    <span class="rol-badge" th:each="rol : ${usuario.roles}" th:text="${rol.descripcion}"></span>
                </div>
            </div>
        </div>

        <div class="form-footer" style="margin-top: 40px;">
            <a th:href="@{/categorias}">Volver al Inicio</a>
        </div>
    </div>
</main>

<footer th:replace="~{layouts/base :: pie}"></footer>

</body>
</html>
